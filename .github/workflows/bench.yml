name: PR Benchmarks

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  bench:
    uses: terjekv/github-action-iai-callgrind/.github/workflows/rust-pr-bench.yml@v2
    with:
      backend: gungraun
      auto_discover: true
      regression_threshold_pct_gungraun: 3
      fail_on_regression: true
