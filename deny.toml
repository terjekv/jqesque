[advisories]
# Use a project-local cache: home directories can be on NFS without file locking.
# Keep it separate from cargo-audit's checkout.
db-path = "target/security/deny"
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "warn"

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
