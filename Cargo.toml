[package]
name = "jqesque"
version = "0.0.3"
edition = "2021"
authors = ["Terje Kvernes <terje@kvernes.no>"]
description = "Simple string assignment expressions with JQ-esque syntax for JSON interaction"
license = "MIT"
repository = "https://github.com/terjekv/jqesque"
readme = "README.md"
keywords = ["jq", "json", "expression", "assignment"]
categories = ["parsing"]

[dependencies]
nom-language = "0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nom = { version = "8", features = ["alloc"] }
thiserror = "2"
json-patch = "4"
jsonptr = "0.7"

[dev-dependencies]
rstest = "0.26"
gungraun = "=0.19.4"

[[bench]]
name = "parse_scalar_small_callgrind"
harness = false

[[bench]]
name = "parse_array_medium_callgrind"
harness = false

[[bench]]
name = "parse_deep_path_medium_callgrind"
harness = false

[[bench]]
name = "parse_object_large_callgrind"
harness = false

[[bench]]
name = "insert_object_small_callgrind"
harness = false

[[bench]]
name = "insert_array_sparse_medium_callgrind"
harness = false

[[bench]]
name = "insert_deep_path_medium_callgrind"
harness = false

[[bench]]
name = "insert_array_dense_large_callgrind"
harness = false

[[bench]]
name = "merge_object_small_callgrind"
harness = false

[[bench]]
name = "merge_array_medium_callgrind"
harness = false

[[bench]]
name = "merge_deep_object_large_callgrind"
harness = false
